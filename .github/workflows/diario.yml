name: pisos diario
on:
  schedule:
    # Cada hora de 06 a 21 UTC = de 07:00 a 22:00 en invierno (08:00-23:00 en verano), para que un piso nuevo
    # llegue como mucho en una hora (los portales no avisan: hay que preguntarles). El correo solo sale si hay
    # pisos nuevos, y el estado cuenta por día, así que varias pasadas al día no repiten nada.
    # Una vez al día a las 15:00 de España: "0 14 * * *".
    - cron: "0 6-21 * * *"
  workflow_dispatch:     # lo lanza también el PC tras subir Idealista/yaencontre
    inputs:
      enviar_todos:
        description: "Mandar a Belén TODOS los pisos vigentes (resumen), no solo los nuevos"
        type: boolean
        default: false
      probar_aviso:
        description: "Mandar a CORREO_AVISOS un aviso de prueba"
        type: boolean
        default: false

concurrency:
  group: diario
  cancel-in-progress: false

permissions:
  actions: write       # para el paso «Mantener vivo el cron»
  contents: write
  pages: write
  id-token: write

jobs:
  pisos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ponerse al día con main
        # Una ejecución que esperó en cola (concurrency) arranca con el commit del momento en que se lanzó, sin el
        # data/vistos.json que acaba de guardar la anterior: reenviaría los mismos pisos (revisión final).
        run: git fetch -q origin main && git checkout -q -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Recoger, actualizar página y enviar correos
        run: python -m pisos.servidor
        env:
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
          CORREO_AVISOS: ${{ secrets.CORREO_AVISOS }}
          PISOS_FORZAR_AVISO: ${{ inputs.probar_aviso }}     # vacío en las ejecuciones del cron
          PISOS_ENVIAR_TODOS: ${{ inputs.enviar_todos }}
      - name: Guardar el estado (data/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "sin cambios en data/"; exit 0; fi
          git commit -m "datos: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
      - name: Mantener vivo el cron
        # GitHub desactiva los cron de un repositorio público tras 60 días sin actividad, y su documentación no
        # dice si los commits del propio workflow cuentan. Volver a activarlo en cada pasada lo evita
        # (mismo método que liskin/gh-workflow-keepalive).
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/diario.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  # Publicar va en un trabajo aparte, como en el esquema oficial de GitHub Pages: dentro del mismo trabajo,
  # deploy-pages no encontraba el artefacto recién subido (medido el 20/11/2026: 2 fallos seguidos con el
  # artefacto presente después).
  publicar:
    needs: pisos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
